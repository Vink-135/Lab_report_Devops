{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm mt-4">
            <div class="card-header bg-white pt-4 pb-2 border-bottom-0">
                <h3 class="text-center text-primary fw-bold mb-0">Upload Report</h3>
                <p class="text-center text-muted mt-2">Booking #{{ booking.id }} - {{ booking.test_name }}</p>
            </div>
            <div class="card-body p-4 pt-2">
                <div class="bg-light p-3 rounded mb-4">
                    <div class="row">
                        <div class="col-6"><span class="text-muted">Patient:</span> <span class="fw-medium">{{ booking.patient_name }}</span></div>
                        <div class="col-6"><span class="text-muted">Date:</span> <span class="fw-medium">{{ booking.booking_date.strftime('%Y-%m-%d') }}</span></div>
                    </div>
                </div>

                <form method="POST" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label class="form-label text-muted">Select PDF Report</label>
                        <input class="form-control form-control-lg" type="file" name="report_file" accept=".pdf" required>
                        <div class="form-text">Only .pdf files up to 16MB are allowed.</div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-muted">Remarks (Optional)</label>
                        <textarea name="remarks" class="form-control" rows="3" placeholder="Enter any specific notes for the patient..."></textarea>
                    </div>
                    <div class="d-flex gap-2">
                        <a href="{{ url_for('admin_bookings') }}" class="btn btn-light btn-lg flex-fill rounded-pill fw-medium">Cancel</a>
                        <button type="submit" class="btn btn-primary btn-lg flex-fill rounded-pill fw-medium"><i class="bi bi-upload me-2"></i>Upload</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
